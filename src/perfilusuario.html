<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SineKerido - Menú de usuario</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Calibri, "Segoe UI", Arial, sans-serif;
      font-size: 1.25rem;
      color: #111;
      background: #fff;
    }

    .marco {
      max-width: 960px;
      margin: 1rem auto;
      border: 4px solid #000;
    }

    header {
      border-bottom: 4px solid #000;
      text-align: center;
      padding: 1.3rem 1rem;
      font-size: 1.5rem;
    }

    main {
      display: flex;
      gap: 3rem;
      padding: 2.5rem 3rem 3rem;
      align-items: flex-start;
    }

    /* Foto opcional */
    .foto {
      flex: 0 0 230px;
      width: 230px;
      height: 230px;
      border: 4px solid #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      background: #fff center / cover no-repeat;
      padding: 0;
      font: inherit;
      color: inherit;
    }
    .foto:hover, .foto:focus-visible { background-color: #f1f1f1; outline: none; }
    .foto.con-imagen span { display: none; }

    .datos { flex: 1; min-width: 0; }
    .datos > * { margin: 0 0 2rem; }

    .bloque small, .bloque .politica {
      display: block;
      font-size: 1.15rem;
    }

    .puntos { font-weight: bold; }

    /* Botones con aspecto de texto, como en el boceto */
    .enlace {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .enlace:hover, .enlace:focus-visible { text-decoration: underline; outline: none; }
    .enlace.peligro:hover { color: #b00020; }

    /* Aviso temporal */
    #aviso {
      min-height: 1.5rem;
      font-size: 1rem;
      color: #0a6b2d;
    }

    /* Ventana de confirmación */
    dialog {
      border: 3px solid #000;
      padding: 1.5rem 2rem;
      max-width: 420px;
      font-size: 1.1rem;
    }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    dialog .acciones { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }
    dialog button {
      font: inherit;
      padding: .4rem 1rem;
      border: 2px solid #000;
      background: #fff;
      cursor: pointer;
    }
    dialog button.rojo { background: #b00020; color: #fff; border-color: #b00020; }

    @media (max-width: 700px) {
      main { flex-direction: column; align-items: center; padding: 1.5rem; gap: 1.5rem; }
      .datos { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="marco">
    <header>SineKerido</header>

    <main>
      <button type="button" class="foto" id="foto" title="Cambiar foto" aria-label="Cambiar foto de perfil">
        <span>Foto opcional</span>
      </button>
      <input type="file" id="inputFoto" accept="image/*" hidden>

      <section class="datos">
        <div class="bloque">
          Menú de usuario:<br>
          Hola <span id="nombre">MariaAntonia</span>!!
        </div>

        <div class="bloque">
          Puntos disponibles: <span class="puntos" id="puntos">0</span>
          <span class="politica" id="politica"></span>
        </div>

        <div class="bloque">Gmail: <span id="email"></span></div>

        <div><button type="button" class="enlace" id="btnPassword">Restablecer contraseña</button></div>

        <div><button type="button" class="enlace peligro" id="btnBorrar">Borrar cuenta</button></div>

        <div id="aviso" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <dialog id="dialogo">
    <p id="dialogoTexto"></p>
    <div class="acciones">
      <button type="button" id="dialogoCancelar">Cancelar</button>
      <button type="button" id="dialogoAceptar" class="rojo">Aceptar</button>
    </div>
  </dialog>

  <script src="perfilusuario.js"></script>
</body>
</html>
