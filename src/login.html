<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SineKerido - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>
<body class="login-body">

    <header class="main-header">
        <h1>SineKerido</h1>
    </header>

    <main class="login-container">

        <div class="login-box">
            <h2 id="titulo-formulario">Iniciar Sesión</h2>

            <form id="login-form" action="#" method="POST" novalidate>

                <!-- Solo visible al crear cuenta -->
                <div class="form-group" id="grupo-nombre" hidden>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="email">Gmail:</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="tucorreo@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="********">
                </div>

                <!-- Solo visible al crear cuenta -->
                <div class="form-group" id="grupo-password2" hidden>
                    <label for="password2">Repetir contraseña:</label>
                    <input type="password" id="password2" name="password2" autocomplete="new-password" placeholder="********">
                </div>

                <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn-submit" id="btn-enviar">Entrar</button>
            </form>

            <div class="login-footer">
                <p><span id="texto-cambio">¿No tienes cuenta?</span> <a href="#" id="enlace-cambio">Pulsa aquí</a></p>
            </div>

        </div>
    </main>

</body>
</html>
