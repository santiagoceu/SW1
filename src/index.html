<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SineKerido - Menú principal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body class="login-body">

    <header class="main-header">
        <h1>SineKerido</h1>

        <!-- Icono de usuario (clicable): va al login o al perfil según haya sesión -->
        <a href="login.html" class="icono-usuario" id="enlace-usuario" title="Iniciar sesión" aria-label="Iniciar sesión">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
            </svg>
        </a>
    </header>

    <main class="menu-principal">
        <h2 class="titulo-menu">Menú Principal</h2>

        <section class="seccion" aria-labelledby="titulo-peliculas">
            <h3 id="titulo-peliculas">Películas Disponibles</h3>
            <div class="tarjetas" id="lista-peliculas"></div>
        </section>

        <section class="seccion" aria-labelledby="titulo-menus">
            <h3 id="titulo-menus">Menús disponibles</h3>
            <div class="tarjetas cuadradas" id="lista-menus"></div>
        </section>
    </main>

    <!-- Detalle de un menú -->
    <dialog id="dialogo-menu">
        <h3 id="menu-titulo"></h3>
        <p id="menu-descripcion"></p>
        <p class="menu-precio" id="menu-precio"></p>
        <div class="acciones">
            <button type="button" id="menu-cerrar">Cerrar</button>
            <button type="button" id="menu-anadir" class="rojo">Añadir al pedido</button>
        </div>
    </dialog>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>

</body>
</html>
